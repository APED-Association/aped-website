# Pages CMS: APED website editor.
# Editors are invited by email and sign in with that email. No GitHub account,
# no token. Saving commits to this repo; .github/workflows/deploy.yml rebuilds
# and publishes the site in about a minute.

settings:
  content:
    merge: true

media:
  - name: photos
    label: Website photos
    input: assets/photos
    output: /assets/photos
    categories: [image]
    rename: safe
  - name: team
    label: Team photos
    input: assets/team
    output: /assets/team
    categories: [image]
    rename: safe
  - name: uploads
    label: News and page photos
    input: assets/uploads
    output: /assets/uploads
    categories: [image]
    rename: safe

content:
  - name: website
    label: Website pages
    type: group
    items:
      # ─────────────────────────── HOME ───────────────────────────
      - name: home
        label: Home
        type: file
        path: content/home.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - { name: badge, label: Small badge, type: string }
              - { name: headline, label: Headline, type: string }
              - { name: highlight, label: Word in the headline shown in yellow, type: string, description: "Must match a word in the headline exactly." }
              - { name: paragraph, label: Paragraph under the headline, type: text }
              - { name: primary_button, label: Yellow button, type: string }
              - { name: secondary_button, label: Outline button, type: string }
              - { name: photo_top, label: Top photo, type: image, options: { media: photos } }
              - { name: caption_top, label: Top photo caption, type: string }
              - { name: photo_bottom, label: Bottom photo, type: image, options: { media: photos } }
              - { name: caption_bottom, label: Bottom photo caption, type: string }
          - name: stats
            label: Numbers bar (green)
            type: object
            list: { collapsible: { collapsed: true, summary: "{number} {label}" } }
            description: "Type {years} to show the years since APED was founded. It updates by itself."
            fields:
              - { name: number, label: Number, type: string }
              - { name: label, label: Label, type: string }
          - name: story
            label: Our Story
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: paragraph, label: Paragraph, type: text }
              - { name: quote, label: Quote, type: text }
              - { name: button, label: Button, type: string }
              - { name: photo_1, label: Photo 1, type: image, options: { media: photos } }
              - { name: photo_2, label: Photo 2, type: image, options: { media: photos } }
              - { name: photo_3, label: Photo 3, type: image, options: { media: photos } }
              - { name: photo_4, label: Photo 4, type: image, options: { media: photos } }
          - name: programs
            label: What We Do (activities)
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: intro, label: Introduction, type: text }
              - name: items
                label: Activities
                type: object
                list: { collapsible: { collapsed: true, summary: "{title}" } }
                fields:
                  - { name: icon, label: Icon (emoji), type: string }
                  - name: color
                    label: Icon color
                    type: select
                    options: { values: [ { name: edu, label: Blue }, { name: health, label: Green }, { name: women, label: Pink }, { name: civic, label: Yellow } ] }
                  - { name: title, label: Title, type: string }
                  - { name: text, label: Description, type: text }
                  - { name: link_label, label: Link text, type: string }
                  - name: link_to
                    label: Link goes to
                    type: select
                    options: { values: [ { name: about, label: About Us }, { name: impact, label: Impact }, { name: project, label: Our Project }, { name: involve, label: Get Involved }, { name: contact, label: Contact }, { name: news, label: News }, { name: donate, label: Donate } ] }
          - name: impact
            label: Impact numbers
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: intro, label: Introduction, type: text }
              - name: items
                label: Numbers
                type: object
                list: { collapsible: { collapsed: true, summary: "{number}{unit} {label}" } }
                fields:
                  - { name: number, label: Number, type: string }
                  - { name: unit, label: "Symbol after the number (+ or %)", type: string }
                  - { name: label, label: Label, type: text, description: "Each new line starts a new line on the page." }
                  - { name: note, label: Small note underneath, type: string }
              - { name: button, label: Button, type: string }
          - name: spotlight
            label: Health center spotlight
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - { name: photo, label: Photo, type: image, options: { media: photos } }
              - { name: progress_title, label: Progress card title, type: string, description: "Amounts raised and the goal come from Laying the Foundation (Donate page)." }
              - name: milestones
                label: Milestones
                type: object
                list: { collapsible: { collapsed: true, summary: "{title}" } }
                fields:
                  - name: status
                    label: Status
                    type: select
                    options: { values: [ { name: done, label: Done }, { name: active, label: In progress }, { name: pending, label: Not started } ] }
                  - { name: title, label: Title, type: string }
                  - { name: detail, label: Detail, type: string, description: "Write {goal} where the Foundation campaign goal should appear. It is filled in from Laying the Foundation." }
              - { name: button, label: Button, type: string }
          - name: testimonials
            label: Testimonials
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - name: items
                label: Testimonials
                type: object
                list: { collapsible: { collapsed: true, summary: "{name}" } }
                fields:
                  - { name: quote, label: Quote, type: text }
                  - { name: initials, label: Initials in the circle, type: string }
                  - { name: name, label: Name, type: string }
                  - { name: role, label: Role or place, type: string }
          - name: action
            label: Yellow call to action
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: text, description: "Each new line starts a new line on the page." }
              - { name: text, label: Paragraph, type: text }
              - { name: donate_button, label: Donate button, type: string }
              - { name: volunteer_button, label: Volunteer button, type: string }
          - name: newsletter
            label: Newsletter signup
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: string }
              - { name: button, label: Button, type: string }

      # ─────────────────────────── ABOUT ───────────────────────────
      - name: about
        label: About Us
        type: file
        path: content/about.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - { name: button, label: Button, type: string }
              - { name: photo, label: Photo, type: image, options: { media: photos } }
          - name: mission
            label: Our Mission
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Mission statement, type: text }
          - name: values
            label: Values (numbered cards)
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
          - name: team_section
            label: Leadership heading
            type: object
            description: "The people themselves are under Leadership team."
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
          - name: territory
            label: Area of intervention
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: paragraphs, label: Paragraphs, type: text, list: true }
              - { name: municipality_1_label, label: First group name, type: string }
              - { name: municipality_1, label: First group cantons, type: string, list: true }
              - { name: municipality_2_label, label: Second group name, type: string }
              - { name: municipality_2, label: Second group cantons, type: string, list: true }
          - name: newsletter
            label: Newsletter signup
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: string }
              - { name: button, label: Button, type: string }

      # ─────────────────────────── IMPACT ───────────────────────────
      - name: impact
        label: Impact
        type: file
        path: content/impact.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - { name: badge, label: Badge, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - { name: photo, label: Background photo, type: image, options: { media: photos } }
          - name: figures
            label: Key figures
            type: object
            list: { collapsible: { collapsed: true, summary: "{number} {label}" } }
            fields:
              - { name: number, label: Number, type: string }
              - { name: label, label: Label, type: string }
          - name: performance
            label: Program performance
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - name: sectors
                label: Sectors (table and bars)
                type: object
                list: { collapsible: { collapsed: true, summary: "{name} {rate}%" } }
                description: "The bars sort themselves from highest to lowest rate."
                fields:
                  - { name: name, label: Sector, type: string }
                  - { name: planned, label: Planned, type: string }
                  - { name: achieved, label: Achieved, type: string }
                  - { name: rate, label: "Rate (%)", type: number }
          - name: insights
            label: Insight cards
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: warning, label: Show in the yellow style, type: boolean }
          - name: community
            label: Community impact
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - name: areas
                label: Areas
                type: object
                list: { collapsible: { collapsed: true, summary: "{title}" } }
                fields:
                  - { name: icon, label: Icon (emoji), type: string }
                  - name: color
                    label: Icon color
                    type: select
                    options: { values: [ { name: edu, label: Blue }, { name: health, label: Green }, { name: wash, label: Light blue }, { name: women, label: Pink } ] }
                  - { name: title, label: Title, type: string }
                  - { name: points, label: Points, type: string, list: true }
          - name: challenges
            label: Key challenges
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: items, label: Challenges, type: string, list: true }
          - name: priority
            label: Strategic priority
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: paragraphs, label: Paragraphs, type: text, list: true }
              - { name: services, label: Services list, type: string, list: true }
              - { name: button, label: Button, type: string }
              - { name: photo, label: Photo, type: image, options: { media: photos } }
          - name: outlook
            label: Strategic outlook
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: items, label: Goals (numbered automatically), type: string, list: true }
          - name: why
            label: Why support APED
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: reasons, label: Reasons, type: string, list: true }
              - { name: primary_button, label: First button, type: string }
              - { name: secondary_button, label: Second button, type: string }

      # ─────────────────────────── PROJECT ───────────────────────────
      - name: project
        label: Our Project
        type: file
        path: content/project.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - { name: funding_title, label: Funding card title, type: string, description: "Amounts raised and the goal come from Laying the Foundation (Donate page)." }
          - name: roadmap
            label: Project roadmap
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - name: phases
                label: Phases (numbered automatically)
                type: object
                list: { collapsible: { collapsed: true, summary: "{title}" } }
                fields:
                  - { name: title, label: Title, type: string }
                  - { name: text, label: Description, type: text, description: "Write {goal} where the Foundation campaign goal should appear. It is filled in from Laying the Foundation." }
                  - name: status
                    label: Status
                    type: select
                    options: { values: [ { name: active, label: Active }, { name: pending, label: Upcoming } ] }
                  - { name: status_text, label: Status text, type: string }
          - name: partners
            label: Founding partner levels
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - name: levels
                label: Levels
                type: object
                list: { collapsible: { collapsed: true, summary: "{amount} {title}" } }
                fields:
                  - { name: amount, label: Amount, type: string }
                  - { name: title, label: Title, type: string }
                  - { name: text, label: Description, type: text }
                  - { name: button, label: Button, type: string }
                  - { name: featured, label: Highlight this level, type: boolean }
                  - { name: tag, label: Highlight tag, type: string }

      # ─────────────────────────── GET INVOLVED ───────────────────────────
      - name: involve
        label: Get Involved
        type: file
        path: content/involve.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
          - name: donate
            label: Donate card
            type: object
            fields:
              - { name: icon, label: Icon (emoji), type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: button, label: Button, type: string }
          - name: volunteer
            label: Volunteer card
            type: object
            fields:
              - { name: icon, label: Icon (emoji), type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: button, label: Button, type: string }
          - name: partner
            label: Partner card
            type: object
            fields:
              - { name: icon, label: Icon (emoji), type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: button, label: Button, type: string }
          - name: volunteer_form
            label: Volunteer application heading
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }

      # ─────────────────────────── CONTACT ───────────────────────────
      - name: contact
        label: Contact
        type: file
        path: content/contact.json
        format: json
        fields:
          - { name: label, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: location, label: Location, type: string }
          - { name: linkedin, label: LinkedIn, type: string }
          - { name: donorbox, label: Donorbox campaign, type: string }
          - name: recruiting
            label: Recruiting box
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: "Text (the email address is added after it)", type: text }
              - { name: subject, label: Email subject line, type: string }
          - { name: form_title, label: Message form title, type: string }

      # ─────────────────────────── DONATE ───────────────────────────
      - name: donate
        label: Donate
        type: file
        path: content/donate.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            description: "The page opens with the Laying the Foundation section (edit it under Laying the Foundation). Only the Title shows here, as the small yellow label above it. The Small label and Paragraph are kept but not shown."
            type: object
            fields:
              - { name: label, label: "Small label (not shown)", type: string }
              - { name: title, label: "Title (shown as the small label above Laying the Foundation)", type: string }
              - { name: text, label: "Paragraph (not shown)", type: text }
          - name: gift
            label: Gift heading
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
          - name: amounts
            label: Gift amounts
            type: object
            list: { collapsible: { collapsed: true, summary: "{amount} {note}" } }
            fields:
              - { name: amount, label: Amount, type: string }
              - { name: note, label: What it does, type: string }
              - { name: preselected, label: Selected when the page opens, type: boolean }
          - { name: custom_label, label: Custom amount label, type: string }
          - { name: paypal_button, label: PayPal button, type: string }
          - { name: secure_note, label: Note under the buttons, type: string }
          - name: wire
            label: Wire transfer box
            type: object
            fields:
              - { name: heading, label: Heading, type: string }
              - { name: before_email, label: Text before the email address, type: string }
              - { name: after_email, label: Text after the email address, type: string }
          - name: partnership
            label: Partnership box
            type: object
            fields:
              - { name: heading, label: Heading, type: string }
              - { name: text, label: Text, type: text }
          - name: sidebar
            label: Side panel
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: subtitle, label: Subtitle, type: string }
              - { name: goal_label, label: Goal label, type: string }
              - { name: trust, label: Reasons to trust, type: string, list: true }
              - { name: question, label: "Questions line (the email address is added after it)", type: string }

      # ─────────────────────── LAYING THE FOUNDATION ───────────────────────
      - name: campaign
        label: "Laying the Foundation (campaign section on the Donate page)"
        type: file
        path: content/campaign.json
        format: json
        fields:
          - { name: label, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Paragraph about the first stage, type: text }
          - { name: promise, label: "Promise under the title (one or two short sentences)", type: text }
          - { name: photo, label: Photo beside the goal card, type: image, options: { media: photos }, description: "Use a real photo of the site. A square or landscape photo works best." }
          - { name: photo_alt, label: "Photo description (for screen readers)", type: string, description: "Say what the photo shows, in one sentence." }
          - { name: budget_label, label: Budget small label, type: string }
          - { name: budget_title, label: Budget title, type: string }
          - { name: budget_intro, label: Budget paragraph (shown when the estimate is opened), type: text }
          - { name: estimate_summary, label: "Estimate button title", type: string, description: "The line a visitor clicks to open the full estimate table." }
          - { name: estimate_summary_sub, label: "Estimate button subtitle", type: string }
          - name: goal_mode
            label: "What the goal covers"
            type: select
            options: { values: [ { name: lot_only, label: "Lot 1 only" }, { name: with_reserve, label: "Lot 1 plus the reserve" }, { name: all_in, label: "Lot 1 plus the reserve and VAT" } ] }
            description: "The goal is worked out from the Lot 1 amount, so it is never typed in. It follows the reserve percent, the VAT percent and the exchange rate below, and it is the same goal on the Home page, the Our Project page and the Donate side panel."
          - { name: goal_confirmed, label: "APED has confirmed the goal", type: boolean, description: "Tick this only after APED has confirmed the goal figure. Until then the site build prints a warning and the goal is marked as unconfirmed in the page source." }
          - { name: goal_note, label: "Short note under the goal (optional)", type: text, description: "Leave empty to show no note. If the goal is higher than the Lot 1 amount in the table, you can explain here what it covers." }
          - { name: raised_usd, label: "Raised so far in US dollars", type: number, description: "Type the real total. Leave 0 until a gift has arrived." }
          - { name: show_progress, label: "Show the raised and goal box", type: boolean, description: "Untick to hide the box and show only the budget." }
          - { name: progress_title, label: Title of the raised and goal box, type: string }
          - { name: goal_label, label: Word before the goal, type: string }
          - { name: raised_label, label: Word after the amount raised, type: string }
          - name: goal_basis
            label: "Sentence saying what the goal covers"
            type: object
            description: "The sentence shown follows 'What the goal covers' above. Write {reserve_percent} and {vat_percent} where the percents go; they are filled in."
            fields:
              - { name: lot_only, label: "When the goal is Lot 1 only", type: string }
              - { name: with_reserve, label: "When the goal is Lot 1 plus the reserve", type: string }
              - { name: all_in, label: "When the goal is Lot 1 plus the reserve and VAT", type: string }
          - { name: gift_link_label, label: "Goal card button text", type: string, description: "The button scrolls down to the gift form on the same page." }
          - name: lots
            label: "Budget lots (amounts in FCFA)"
            type: object
            list: { collapsible: { collapsed: true, summary: "Lot {number}: {name}" } }
            description: "The seven lots from the construction estimate. The subtotal, the reserve, the total and every US dollar amount are worked out from these numbers."
            fields:
              - { name: number, label: Lot number, type: number }
              - { name: name, label: Name of the works, type: string }
              - { name: fcfa, label: "Amount in FCFA (digits only)", type: number }
              - { name: this_campaign, label: "This is the lot this campaign raises for", type: boolean }
          - { name: ladder_title, label: "Small title above the seven stages", type: string }
          - { name: now_label, label: "Word on the campaign lot (stage ladder)", type: string }
          - { name: next_label, label: "Word on the other lots (stage ladder)", type: string }
          - { name: this_campaign_tag, label: Tag on the campaign lot, type: string }
          - { name: rate_fcfa_per_usd, label: "FCFA per US dollar", type: number, description: "Used for every US dollar amount in the section. About 603.3 today." }
          - { name: round_usd_to, label: "Round US dollar amounts to the nearest", type: number, description: "100 means $31,019 is shown as $31,000." }
          - { name: subtotal_label, label: Subtotal line label, type: string }
          - { name: reserve_percent, label: "Reserve percent", type: number, description: "10 means the reserve is 10 percent of the seven lots. It is always shown as its own line." }
          - { name: reserve_label, label: "Word after the percent (reserve)", type: string }
          - { name: reserve_note, label: What the reserve is for, type: string }
          - { name: vat_applies, label: "VAT applies", type: boolean, description: "Untick if an exemption is granted. The VAT line, its footnote and the VAT inside every total and the goal then disappear, and the totals are worked out again." }
          - { name: vat_percent, label: "VAT percent", type: number, description: "18 means VAT is 18 percent of the seven lots plus the reserve. It is always shown as its own line." }
          - { name: vat_label, label: "VAT line label", type: string, description: "The percent and the asterisk are added after it, so VAT shows as VAT (18%)*." }
          - { name: vat_note, label: "VAT footnote under the table", type: text, description: "Starts with the asterisk. Write {vat_percent} where the percent goes and it is filled in from the VAT percent above." }
          - { name: vat_note_confirmed, label: "APED has approved the VAT wording", type: boolean, description: "Tick this only after APED has approved the VAT line and footnote wording. Until then the site build prints a warning." }
          - { name: construction_note, label: "Line under the table about what it covers", type: string }
          - { name: total_label, label: "Total line label (VAT included)", type: string }
          - { name: total_label_without_vat, label: "Total line label (when VAT does not apply)", type: string }
          - name: building
            label: "The building (drawings band under the stage ladder)"
            type: object
            description: "APED's own drawings of the health center. Untick Show to hide the whole band."
            fields:
              - { name: show, label: Show this band, type: boolean }
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: intro, label: Paragraph, type: text }
              - { name: render, label: "Drawing of the finished building", type: image, options: { media: photos } }
              - { name: render_alt, label: "Drawing description (for screen readers)", type: string }
              - { name: render_caption, label: Caption under the drawing, type: string }
              - { name: credit, label: "Credit for the drawings (optional)", type: string, description: "For example: Drawings by [name], building technician. Leave empty until APED confirms the name." }
              - { name: plan, label: Floor plan, type: image, options: { media: photos } }
              - { name: plan_alt, label: "Floor plan description (for screen readers)", type: string }
              - { name: plan_title, label: Title beside the floor plan, type: string }
              - name: rooms
                label: What is inside
                type: object
                list: { collapsible: { collapsed: true, summary: "{group}" } }
                fields:
                  - { name: group, label: Group, type: string }
                  - { name: items, label: Rooms, type: string }
              - { name: foundation_plan, label: Foundation plan, type: image, options: { media: photos } }
              - { name: foundation_plan_alt, label: "Foundation plan description (for screen readers)", type: string }
              - { name: foundation_title, label: Title beside the foundation plan, type: string }
              - { name: foundation_text, label: Sentence beside the foundation plan, type: text }
          - name: first_block
            label: Lay the First Block
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: text, label: "One sentence", type: text, description: "Keep it to one sentence. Do not promise which gifts are engraved until APED has decided." }
          - { name: donorbox_url, label: "Donorbox link (gift form on the Donate page)", type: string, description: "The Donate button in the gift form opens this link with the chosen amount. Today this is the existing APED Donorbox campaign. Replace it with the new Laying the Foundation campaign link once APED creates it. A full web address starting with https://." }
          - { name: paypal_url, label: "PayPal link (gift form on the Donate page)", type: string, description: "A full web address starting with https://." }

      # ─────────────────────────── THANKS ───────────────────────────
      - name: thanks
        label: Thank-you page (after newsletter signup)
        type: file
        path: content/thanks.json
        format: json
        fields:
          - { name: label, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: tip_heading, label: Tip heading, type: string }
          - { name: tip_text, label: "Tip text (**bold** for bold)", type: text }
          - { name: home_button, label: Home button, type: string }
          - { name: impact_button, label: Impact button, type: string }

  # ─────────────────────────── ADD A PAGE ───────────────────────────
  - name: pages
    label: Extra pages (events, fundraisers)
    type: collection
    path: content/pages
    format: yaml-frontmatter
    exclude: [pages.11tydata.cjs]
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, published, show_in_menu]
    fields:
      - { name: title, label: Page title, type: string, required: true, description: "The web address comes from the title, e.g. apedassociation.org/giving-tuesday-2026/" }
      - { name: label, label: Small label above the title, type: string, description: "For example: Event, Fundraiser, Announcement" }
      - { name: intro, label: Short introduction, type: text }
      - { name: photo, label: Main photo, type: image, options: { media: uploads } }
      - { name: body, label: Page content, type: rich-text, options: { format: markdown, media: uploads } }
      - { name: button_label, label: Button text (optional), type: string }
      - { name: button_link, label: Button link (optional), type: string, description: "A full web address, such as a Donorbox or registration link." }
      - { name: show_in_menu, label: Show in the top menu, type: boolean, default: false }
      - { name: menu_label, label: Menu name (if shorter than the title), type: string }
      - { name: published, label: Live on the website, type: boolean, default: true }

  # ─────────────────────────── NEWS ───────────────────────────
  - name: news
    label: News
    type: file
    path: content/blog.json
    format: json
    fields:
      - { name: page_label, label: Small label on the News page, type: string }
      - { name: page_title, label: News page title, type: string }
      - name: posts
        label: Articles
        type: object
        list: { collapsible: { collapsed: true, summary: "{title} ({date})" } }
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: date, label: Date, type: date, options: { format: yyyy-MM-dd } }
          - { name: thumbnail, label: Photo, type: image, options: { media: uploads } }
          - { name: body, label: Article, type: rich-text, options: { format: markdown, media: uploads } }

  # ─────────────────────────── TEAM ───────────────────────────
  - name: team
    label: Leadership team
    type: file
    path: content/team.json
    format: json
    fields:
      - name: members
        label: Team members
        type: object
        list: { collapsible: { collapsed: true, summary: "{name} ({role})" } }
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Role / title, type: string }
          - { name: photo, label: Photo, type: image, options: { media: team } }

  # ─────────────────────────── SITE SETTINGS ───────────────────────────
  - name: site
    label: Site settings (menu, email, phase name, total project cost)
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: email, label: Contact email (used everywhere on the site), type: string }
      - { name: founded, label: "Founding date (YYYY-MM-DD)", type: string, description: "Used for the years-in-the-field number." }
      - { name: logo_name, label: Name next to the logo, type: string }
      - { name: logo_sub, label: Line under the name, type: string }
      - name: menu
        label: Menu names
        type: object
        fields:
          - { name: home, label: Home, type: string }
          - { name: about, label: About, type: string }
          - { name: impact, label: Impact, type: string }
          - { name: project, label: Project, type: string }
          - { name: involve, label: Get Involved, type: string }
          - { name: contact, label: Contact, type: string }
          - { name: news, label: News, type: string }
          - { name: donate, label: Donate button, type: string }
      - name: fundraising
        label: Phase name and total project cost
        type: object
        description: "The amount raised, the goal and the percent funded are not set here. They come from Laying the Foundation (Donate page), so every page shows the same figures."
        fields:
          - { name: phase_name, label: Current phase, type: string }
          - { name: project_total, label: Total project cost, type: string }
      - { name: footer_text, label: Footer text (after © and the year), type: string }
