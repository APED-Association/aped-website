# Pages CMS: APED website editor.
# Editors are invited by email and sign in with that email. No GitHub account,
# no token. Saving commits to this repo; .github/workflows/deploy.yml rebuilds
# and publishes the site in about a minute.

settings:
  content:
    merge: true

media:
  - name: photos
    label: Website photos
    input: assets/photos
    output: /assets/photos
    categories: [image]
    rename: safe
  - name: team
    label: Team photos
    input: assets/team
    output: /assets/team
    categories: [image]
    rename: safe
  - name: uploads
    label: News and page photos
    input: assets/uploads
    output: /assets/uploads
    categories: [image]
    rename: safe

content:
  - name: website
    label: Website pages
    type: group
    items:
      # ─────────────────────────── HOME ───────────────────────────
      - name: home
        label: Home
        type: file
        path: content/home.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - { name: badge, label: Small badge, type: string }
              - { name: headline, label: Headline, type: string }
              - { name: highlight, label: Word in the headline shown in yellow, type: string, description: "Must match a word in the headline exactly." }
              - { name: paragraph, label: Paragraph under the headline, type: text }
              - { name: primary_button, label: Yellow button, type: string }
              - { name: secondary_button, label: Outline button, type: string }
              - { name: photo_top, label: Top photo, type: image, options: { media: photos } }
              - { name: caption_top, label: Top photo caption, type: string }
              - { name: photo_bottom, label: Bottom photo, type: image, options: { media: photos } }
              - { name: caption_bottom, label: Bottom photo caption, type: string }
          - name: stats
            label: Numbers bar (green)
            type: object
            list: { collapsible: { collapsed: true, summary: "{number} {label}" } }
            description: "Type {years} to show the years since APED was founded. It updates by itself."
            fields:
              - { name: number, label: Number, type: string }
              - { name: label, label: Label, type: string }
          - name: story
            label: Our Story
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: paragraph, label: Paragraph, type: text }
              - { name: quote, label: Quote, type: text }
              - { name: button, label: Button, type: string }
              - { name: photo_1, label: Photo 1, type: image, options: { media: photos } }
              - { name: photo_2, label: Photo 2, type: image, options: { media: photos } }
              - { name: photo_3, label: Photo 3, type: image, options: { media: photos } }
              - { name: photo_4, label: Photo 4, type: image, options: { media: photos } }
          - name: programs
            label: What We Do (activities)
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: intro, label: Introduction, type: text }
              - name: items
                label: Activities
                type: object
                list: { collapsible: { collapsed: true, summary: "{title}" } }
                fields:
                  - { name: icon, label: Icon (emoji), type: string }
                  - name: color
                    label: Icon color
                    type: select
                    options: { values: [ { name: edu, label: Blue }, { name: health, label: Green }, { name: women, label: Pink }, { name: civic, label: Yellow } ] }
                  - { name: title, label: Title, type: string }
                  - { name: text, label: Description, type: text }
                  - { name: link_label, label: Link text, type: string }
                  - name: link_to
                    label: Link goes to
                    type: select
                    options: { values: [ { name: about, label: About Us }, { name: impact, label: Impact }, { name: project, label: Our Project }, { name: involve, label: Get Involved }, { name: contact, label: Contact }, { name: news, label: News }, { name: donate, label: Donate } ] }
          - name: impact
            label: Impact numbers
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: intro, label: Introduction, type: text }
              - name: items
                label: Numbers
                type: object
                list: { collapsible: { collapsed: true, summary: "{number}{unit} {label}" } }
                fields:
                  - { name: number, label: Number, type: string }
                  - { name: unit, label: "Symbol after the number (+ or %)", type: string }
                  - { name: label, label: Label, type: text, description: "Each new line starts a new line on the page." }
                  - { name: note, label: Small note underneath, type: string }
              - { name: button, label: Button, type: string }
          - name: spotlight
            label: Health center spotlight
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - { name: photo, label: Photo, type: image, options: { media: photos } }
              - { name: progress_title, label: Progress card title, type: string, description: "Amounts raised and the goal are set in Site settings." }
              - name: milestones
                label: Milestones
                type: object
                list: { collapsible: { collapsed: true, summary: "{title}" } }
                fields:
                  - name: status
                    label: Status
                    type: select
                    options: { values: [ { name: done, label: Done }, { name: active, label: In progress }, { name: pending, label: Not started } ] }
                  - { name: title, label: Title, type: string }
                  - { name: detail, label: Detail, type: string }
              - { name: button, label: Button, type: string }
          - name: testimonials
            label: Testimonials
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - name: items
                label: Testimonials
                type: object
                list: { collapsible: { collapsed: true, summary: "{name}" } }
                fields:
                  - { name: quote, label: Quote, type: text }
                  - { name: initials, label: Initials in the circle, type: string }
                  - { name: name, label: Name, type: string }
                  - { name: role, label: Role or place, type: string }
          - name: action
            label: Yellow call to action
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: text, description: "Each new line starts a new line on the page." }
              - { name: text, label: Paragraph, type: text }
              - { name: donate_button, label: Donate button, type: string }
              - { name: volunteer_button, label: Volunteer button, type: string }
          - name: newsletter
            label: Newsletter signup
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: string }
              - { name: button, label: Button, type: string }

      # ─────────────────────────── ABOUT ───────────────────────────
      - name: about
        label: About Us
        type: file
        path: content/about.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - { name: button, label: Button, type: string }
              - { name: photo, label: Photo, type: image, options: { media: photos } }
          - name: mission
            label: Our Mission
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Mission statement, type: text }
          - name: values
            label: Values (numbered cards)
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
          - name: team_section
            label: Leadership heading
            type: object
            description: "The people themselves are under Leadership team."
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
          - name: territory
            label: Area of intervention
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: paragraphs, label: Paragraphs, type: text, list: true }
              - { name: municipality_1_label, label: First group name, type: string }
              - { name: municipality_1, label: First group cantons, type: string, list: true }
              - { name: municipality_2_label, label: Second group name, type: string }
              - { name: municipality_2, label: Second group cantons, type: string, list: true }
          - name: newsletter
            label: Newsletter signup
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: string }
              - { name: button, label: Button, type: string }

      # ─────────────────────────── IMPACT ───────────────────────────
      - name: impact
        label: Impact
        type: file
        path: content/impact.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - { name: badge, label: Badge, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - { name: photo, label: Background photo, type: image, options: { media: photos } }
          - name: figures
            label: Key figures
            type: object
            list: { collapsible: { collapsed: true, summary: "{number} {label}" } }
            fields:
              - { name: number, label: Number, type: string }
              - { name: label, label: Label, type: string }
          - name: performance
            label: Program performance
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - name: sectors
                label: Sectors (table and bars)
                type: object
                list: { collapsible: { collapsed: true, summary: "{name} {rate}%" } }
                description: "The bars sort themselves from highest to lowest rate."
                fields:
                  - { name: name, label: Sector, type: string }
                  - { name: planned, label: Planned, type: string }
                  - { name: achieved, label: Achieved, type: string }
                  - { name: rate, label: "Rate (%)", type: number }
          - name: insights
            label: Insight cards
            type: object
            list: { collapsible: { collapsed: true, summary: "{title}" } }
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: warning, label: Show in the yellow style, type: boolean }
          - name: community
            label: Community impact
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - name: areas
                label: Areas
                type: object
                list: { collapsible: { collapsed: true, summary: "{title}" } }
                fields:
                  - { name: icon, label: Icon (emoji), type: string }
                  - name: color
                    label: Icon color
                    type: select
                    options: { values: [ { name: edu, label: Blue }, { name: health, label: Green }, { name: wash, label: Light blue }, { name: women, label: Pink } ] }
                  - { name: title, label: Title, type: string }
                  - { name: points, label: Points, type: string, list: true }
          - name: challenges
            label: Key challenges
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: items, label: Challenges, type: string, list: true }
          - name: priority
            label: Strategic priority
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: paragraphs, label: Paragraphs, type: text, list: true }
              - { name: services, label: Services list, type: string, list: true }
              - { name: button, label: Button, type: string }
              - { name: photo, label: Photo, type: image, options: { media: photos } }
          - name: outlook
            label: Strategic outlook
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: items, label: Goals (numbered automatically), type: string, list: true }
          - name: why
            label: Why support APED
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: reasons, label: Reasons, type: string, list: true }
              - { name: primary_button, label: First button, type: string }
              - { name: secondary_button, label: Second button, type: string }

      # ─────────────────────────── PROJECT ───────────────────────────
      - name: project
        label: Our Project
        type: file
        path: content/project.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - { name: funding_title, label: Funding card title, type: string, description: "Amounts raised and the goal are set in Site settings." }
          - name: roadmap
            label: Project roadmap
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - name: phases
                label: Phases (numbered automatically)
                type: object
                list: { collapsible: { collapsed: true, summary: "{title}" } }
                fields:
                  - { name: title, label: Title, type: string }
                  - { name: text, label: Description, type: text }
                  - name: status
                    label: Status
                    type: select
                    options: { values: [ { name: active, label: Active }, { name: pending, label: Upcoming } ] }
                  - { name: status_text, label: Status text, type: string }
          - name: partners
            label: Founding partner levels
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
              - name: levels
                label: Levels
                type: object
                list: { collapsible: { collapsed: true, summary: "{amount} {title}" } }
                fields:
                  - { name: amount, label: Amount, type: string }
                  - { name: title, label: Title, type: string }
                  - { name: text, label: Description, type: text }
                  - { name: button, label: Button, type: string }
                  - { name: featured, label: Highlight this level, type: boolean }
                  - { name: tag, label: Highlight tag, type: string }

      # ─────────────────────────── GET INVOLVED ───────────────────────────
      - name: involve
        label: Get Involved
        type: file
        path: content/involve.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
          - name: donate
            label: Donate card
            type: object
            fields:
              - { name: icon, label: Icon (emoji), type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: button, label: Button, type: string }
          - name: volunteer
            label: Volunteer card
            type: object
            fields:
              - { name: icon, label: Icon (emoji), type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: button, label: Button, type: string }
          - name: partner
            label: Partner card
            type: object
            fields:
              - { name: icon, label: Icon (emoji), type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: button, label: Button, type: string }
          - name: volunteer_form
            label: Volunteer application heading
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }

      # ─────────────────────────── CONTACT ───────────────────────────
      - name: contact
        label: Contact
        type: file
        path: content/contact.json
        format: json
        fields:
          - { name: label, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: location, label: Location, type: string }
          - { name: linkedin, label: LinkedIn, type: string }
          - { name: donorbox, label: Donorbox campaign, type: string }
          - name: recruiting
            label: Recruiting box
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: "Text (the email address is added after it)", type: text }
              - { name: subject, label: Email subject line, type: string }
          - { name: form_title, label: Message form title, type: string }

      # ─────────────────────────── DONATE ───────────────────────────
      - name: donate
        label: Donate
        type: file
        path: content/donate.json
        format: json
        fields:
          - name: hero
            label: Top of the page
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
              - { name: text, label: Paragraph, type: text }
          - name: gift
            label: Gift heading
            type: object
            fields:
              - { name: label, label: Small label, type: string }
              - { name: title, label: Title, type: string }
          - name: amounts
            label: Gift amounts
            type: object
            list: { collapsible: { collapsed: true, summary: "{amount} {note}" } }
            fields:
              - { name: amount, label: Amount, type: string }
              - { name: note, label: What it does, type: string }
              - { name: preselected, label: Selected when the page opens, type: boolean }
          - { name: custom_label, label: Custom amount label, type: string }
          - { name: paypal_button, label: PayPal button, type: string }
          - { name: secure_note, label: Note under the buttons, type: string }
          - name: wire
            label: Wire transfer box
            type: object
            fields:
              - { name: heading, label: Heading, type: string }
              - { name: before_email, label: Text before the email address, type: string }
              - { name: after_email, label: Text after the email address, type: string }
          - name: partnership
            label: Partnership box
            type: object
            fields:
              - { name: heading, label: Heading, type: string }
              - { name: text, label: Text, type: text }
          - name: sidebar
            label: Side panel
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: subtitle, label: Subtitle, type: string }
              - { name: goal_label, label: Goal label, type: string }
              - { name: trust, label: Reasons to trust, type: string, list: true }
              - { name: question, label: "Questions line (the email address is added after it)", type: string }

      # ─────────────────────────── THANKS ───────────────────────────
      - name: thanks
        label: Thank-you page (after newsletter signup)
        type: file
        path: content/thanks.json
        format: json
        fields:
          - { name: label, label: Small label, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Paragraph, type: text }
          - { name: tip_heading, label: Tip heading, type: string }
          - { name: tip_text, label: "Tip text (**bold** for bold)", type: text }
          - { name: home_button, label: Home button, type: string }
          - { name: impact_button, label: Impact button, type: string }

  # ─────────────────────────── ADD A PAGE ───────────────────────────
  - name: pages
    label: Extra pages (events, fundraisers)
    type: collection
    path: content/pages
    format: yaml-frontmatter
    exclude: [pages.11tydata.cjs]
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, published, show_in_menu]
    fields:
      - { name: title, label: Page title, type: string, required: true, description: "The web address comes from the title, e.g. apedassociation.org/giving-tuesday-2026/" }
      - { name: label, label: Small label above the title, type: string, description: "For example: Event, Fundraiser, Announcement" }
      - { name: intro, label: Short introduction, type: text }
      - { name: photo, label: Main photo, type: image, options: { media: uploads } }
      - { name: body, label: Page content, type: rich-text, options: { format: markdown, media: uploads } }
      - { name: button_label, label: Button text (optional), type: string }
      - { name: button_link, label: Button link (optional), type: string, description: "A full web address, such as a Donorbox or registration link." }
      - { name: show_in_menu, label: Show in the top menu, type: boolean, default: false }
      - { name: menu_label, label: Menu name (if shorter than the title), type: string }
      - { name: published, label: Live on the website, type: boolean, default: true }

  # ─────────────────────────── NEWS ───────────────────────────
  - name: news
    label: News
    type: file
    path: content/blog.json
    format: json
    fields:
      - { name: page_label, label: Small label on the News page, type: string }
      - { name: page_title, label: News page title, type: string }
      - name: posts
        label: Articles
        type: object
        list: { collapsible: { collapsed: true, summary: "{title} ({date})" } }
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: date, label: Date, type: date, options: { format: yyyy-MM-dd } }
          - { name: thumbnail, label: Photo, type: image, options: { media: uploads } }
          - { name: body, label: Article, type: rich-text, options: { format: markdown, media: uploads } }

  # ─────────────────────────── TEAM ───────────────────────────
  - name: team
    label: Leadership team
    type: file
    path: content/team.json
    format: json
    fields:
      - name: members
        label: Team members
        type: object
        list: { collapsible: { collapsed: true, summary: "{name} ({role})" } }
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Role / title, type: string }
          - { name: photo, label: Photo, type: image, options: { media: team } }

  # ─────────────────────────── SITE SETTINGS ───────────────────────────
  - name: site
    label: Site settings (menu, email, fundraising totals)
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: email, label: Contact email (used everywhere on the site), type: string }
      - { name: founded, label: "Founding date (YYYY-MM-DD)", type: string, description: "Used for the years-in-the-field number." }
      - { name: logo_name, label: Name next to the logo, type: string }
      - { name: logo_sub, label: Line under the name, type: string }
      - name: menu
        label: Menu names
        type: object
        fields:
          - { name: home, label: Home, type: string }
          - { name: about, label: About, type: string }
          - { name: impact, label: Impact, type: string }
          - { name: project, label: Project, type: string }
          - { name: involve, label: Get Involved, type: string }
          - { name: contact, label: Contact, type: string }
          - { name: news, label: News, type: string }
          - { name: donate, label: Donate button, type: string }
      - name: fundraising
        label: Fundraising totals (shown on Home, Our Project and Donate)
        type: object
        fields:
          - { name: phase_name, label: Current phase, type: string }
          - { name: raised, label: Amount raised, type: string }
          - { name: phase_goal, label: Goal for this phase, type: string }
          - { name: project_total, label: Total project cost, type: string }
          - { name: percent_funded, label: "Percent funded (0 to 100)", type: number }
      - { name: footer_text, label: Footer text (after © and the year), type: string }
